<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Grupo Premo · Portal de accionistas</title>
<style>
  :root { --bg:#0f221d; --panel:#16302a; --ink:#e9e4d6; --muted:#a8b5ad; --gold:#d9a441; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  main { max-width:520px; width:100%; background:var(--panel); border:1px solid rgba(217,164,65,.25); border-radius:14px; padding:40px 32px; text-align:center; }
  .marca { font-family:Georgia,"Times New Roman",serif; font-size:28px; letter-spacing:.08em; color:var(--gold); margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 28px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 10px; }
  p { color:var(--muted); line-height:1.5; margin:0; font-size:15px; }
</style>
</head>
<body>
  <main>
    <div class="marca">FINETIA</div>
    <div class="sub">Controller Virtual</div>
    <h1>Grupo Premo · Portal de accionistas</h1>
    <p>Estamos preparando el portal. Muy pronto vas a poder ingresar con tu usuario y contraseña.</p>
  </main>
</body>
</html>
