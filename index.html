<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Grupo Premo · Informe financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f3f1ea; --surface:#ffffff; --surface-2:#f8f6f0; --line:#e3ded0; --line-2:#cfc8b6;
  --ink:#14211c; --ink-2:#47524b; --ink-3:#77817a;
  --band:#0e2a23; --band-2:#143a31; --band-ink:#f1ece0; --band-ink-2:#a9bdb4;
  --accent:#1f6b5a; --accent-ink:#ffffff; --brass:#b07c2a;
  --bad:#a5382b; --bad-bg:#fbeeeb; --warn:#a8741f; --warn-bg:#fbf3e2; --ok:#1f7a55; --ok-bg:#e8f4ee;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --shadow:0 1px 2px rgba(20,33,28,.06), 0 4px 14px rgba(20,33,28,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#0b1613; --surface:#12211c; --surface-2:#162822; --line:#243a33; --line-2:#325046;
  --ink:#f0eadb; --ink-2:#c6c0ad; --ink-3:#8f9b94;
  --band:#06100d; --band-2:#0c1d18; --band-ink:#f1ece0; --band-ink-2:#8fa79d;
  --accent:#4fa591; --accent-ink:#06100d; --brass:#dba94f;
  --bad:#e5705f; --bad-bg:#2b1b18; --warn:#dba94f; --warn-bg:#2a2414; --ok:#56b88b; --ok-bg:#12281f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b1613; --surface:#12211c; --surface-2:#162822; --line:#243a33; --line-2:#325046;
  --ink:#f0eadb; --ink-2:#c6c0ad; --ink-3:#8f9b94;
  --band:#06100d; --band-2:#0c1d18; --band-ink:#f1ece0; --band-ink-2:#8fa79d;
  --accent:#4fa591; --accent-ink:#06100d; --brass:#dba94f;
  --bad:#e5705f; --bad-bg:#2b1b18; --warn:#dba94f; --warn-bg:#2a2414; --ok:#56b88b; --ok-bg:#12281f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'IBM Plex Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:600;margin:0;letter-spacing:.1px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.wrap{max-width:1220px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

/* ---------- ingreso ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#login .tarjeta{width:100%;max-width:400px;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(20,33,28,.14),0 2px 6px rgba(20,33,28,.06)}
#login .cab{background:#2b2b2d;color:#fff;padding:24px 24px 20px}
#login .cab h1{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:22px;font-weight:600;letter-spacing:.2px}
#login .cab p{margin:6px 0 0;font-size:13px;color:#d9d6cc}
#login .cab .rayita{width:48px;height:3px;background:var(--brass);border-radius:2px;margin-top:16px}
#login form{padding:8px 24px 0}
#login .btn{background:#2b2b2d;color:#fff;border-radius:6px;padding:13px 18px;width:100%;margin-top:22px;font-weight:500}
#login .btn:hover{background:#3a3a3d}
#login .pie{padding:26px 24px 20px;text-align:center;font-size:11.5px;color:var(--ink-3)}
.marca{display:flex;align-items:center;gap:12px}
.marca .cuadro{width:38px;height:38px;border:1.5px solid var(--brass);color:var(--brass);display:grid;place-items:center;font-family:'Newsreader',serif;font-weight:700;font-size:17px;letter-spacing:.5px;border-radius:3px}
.marca .t{font-size:13px;letter-spacing:.22em;font-weight:600;text-transform:uppercase}
.marca .s{font-size:11px;letter-spacing:.06em;color:var(--band-ink-2)}
label{display:block;font-size:12px;color:var(--ink-2);margin:14px 0 5px;font-weight:500}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:11px 18px;font-weight:600;cursor:pointer;letter-spacing:.02em}
.btn.full{width:100%;margin-top:20px}
.btn.ghost{background:transparent;color:var(--band-ink);border:1px solid rgba(241,236,224,.28);padding:6px 12px;font-weight:500;font-size:12.5px}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}

/* ---------- cabecera ---------- */
header.top{background:linear-gradient(180deg,var(--band) 0%,var(--band-2) 100%);color:var(--band-ink)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:16px;padding-bottom:14px}
header.top .marca{flex:1;min-width:220px}
.estado{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--band-ink-2);text-align:right;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;border:1px solid transparent}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pill.ok{background:rgba(86,184,139,.16);color:#7fd8ad;border-color:rgba(86,184,139,.35)}
.pill.warn{background:rgba(219,169,79,.16);color:#efc171;border-color:rgba(219,169,79,.4)}
.pill.bad{background:rgba(229,112,95,.16);color:#f2988b;border-color:rgba(229,112,95,.4)}
nav.tabs{background:var(--band-2);border-top:1px solid rgba(241,236,224,.08);position:sticky;top:0;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.12)}
nav.tabs .wrap{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;padding-top:0;padding-bottom:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 16px;cursor:pointer;color:var(--band-ink-2);white-space:nowrap;font-weight:500;letter-spacing:.02em}
nav.tabs button:hover{color:var(--band-ink)}
nav.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--brass)}
main{padding:22px 0 56px}

/* ---------- componentes ---------- */
.banner{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:3px;margin:0 0 14px;font-size:13px}
.banner.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.barra{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{background:transparent;border:0;padding:8px 16px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--band);color:var(--band-ink);font-weight:600}
.titulo-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px}
.titulo-sec h2{font-size:21px}
.titulo-sec span{color:var(--ink-3);font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h3{font-size:17px;margin-bottom:10px}
.help{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.panel{margin-bottom:0}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

/* titular ejecutivo */
.hero{background:linear-gradient(135deg,var(--band) 0%,var(--band-2) 100%);color:var(--band-ink);border-radius:6px;padding:24px 28px;margin-bottom:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.5fr 1fr;gap:28px}
.hero .et{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--band-ink-2);margin-bottom:8px}
.hero h2{font-size:27px;line-height:1.22;font-weight:600;margin-bottom:12px}
.hero ul{margin:0;padding:0;list-style:none;color:var(--band-ink-2);font-size:13.5px}
.hero li{padding:5px 0 5px 16px;position:relative;border-top:1px solid rgba(241,236,224,.1)}
.hero li:before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;background:var(--brass);border-radius:50%}
.hero li b{color:var(--band-ink);font-weight:600}
.hero .uso h4{margin:0 0 10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--band-ink-2);font-weight:500}
.uso .fila{margin-bottom:14px}
.uso .fila .cab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.uso .riel{height:9px;border-radius:5px;background:rgba(241,236,224,.14);position:relative;overflow:hidden}
.uso .riel i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#7fd8ad}
.uso .riel i.w{background:#efc171}
.uso .riel i.b{background:#f2988b}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:20px}.hero h2{font-size:22px}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line-2);border-radius:6px;padding:13px 15px 10px;box-shadow:var(--shadow)}
.kpi.bad{border-top-color:var(--bad)}.kpi.ok{border-top-color:var(--ok)}.kpi.warn{border-top-color:var(--brass)}
.kpi .l{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.kpi .v{font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:600;margin:3px 0 1px;letter-spacing:-.2px}
.kpi .v.bad{color:var(--bad)}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi svg{display:block;margin-top:6px}

.atencion{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.atencion .it{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:4px;padding:11px 14px;background:var(--surface-2)}
.atencion .it.r{border-left-color:var(--bad)}
.atencion .it b.v{display:block;font-family:'Newsreader',serif;font-size:21px}
.atencion .it span{font-size:12.5px;color:var(--ink-2)}

/* tablas */
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--band);color:var(--band-ink);font-weight:600;border-bottom:0;padding:9px 9px;font-size:12px}
thead th small{display:block;font-weight:400;color:var(--band-ink-2);font-size:11px}
tr.sec td{background:var(--surface-2);font-weight:700;letter-spacing:.08em;font-size:11px;text-transform:uppercase;color:var(--ink-2);border-top:1px solid var(--line-2)}
tr.sub td{font-weight:700;background:var(--surface-2)}
tr.res td{font-weight:700;background:var(--band);color:var(--band-ink);border-bottom:0}
tr.det td:first-child{padding-left:22px}
tr.ini td{color:var(--ink-2);font-style:italic}
td.bajo{color:var(--bad);font-weight:600}
table.tl td,table.tl th{text-align:left}
table.tl td.num,table.tl th.n{text-align:right}
table.fl td:first-child,table.fl th:first-child{position:sticky;left:0;z-index:1}
table.fl td:first-child{white-space:normal;min-width:200px;max-width:240px;background:var(--surface)}
table.fl thead th:first-child{background:var(--band)}
table.fl tr.sec td:first-child,table.fl tr.sub td:first-child{background:var(--surface-2)}
table.fl tr.res td:first-child{background:var(--band)}
table.fl th,table.fl td{padding:7px 7px}
tr.tot td{font-weight:700;background:var(--surface-2)}
tr.sel td{background:var(--ok-bg);font-weight:700}
td.neg{color:var(--bad)}
td.wrapc{white-space:normal}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;border:1.5px solid var(--accent);vertical-align:0}
.dot.c{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink-2);margin:2px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cert{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.cert i{display:inline-block;width:38px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.cert i b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}

/* gráficos */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:5px;padding:7px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:3;display:none;white-space:nowrap}

/* cumplimiento */
.cump{display:grid;grid-template-columns:auto 1fr auto;gap:8px 20px;align-items:center}
.cump h3{margin:0}
.cump input[type=range]{width:100%;accent-color:var(--accent);min-width:160px}
.cump .val{font-family:'Newsreader',serif;font-size:26px;font-weight:600;min-width:64px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.chips button{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:3px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.chips button[aria-pressed=true]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
@media (max-width:640px){.cump{grid-template-columns:1fr auto}.cump h3{grid-column:1/-1}}
details.panel summary{cursor:pointer;color:var(--ink-2);font-weight:600}
footer{color:var(--ink-3);font-size:12px;padding:12px 0 8px;border-top:1px solid var(--line);margin-top:20px}

@media (max-width:640px){.kpi .v{font-size:22px}.wrap{padding:0 14px}.titulo-sec h2{font-size:18px}}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff}
  header.top .btn,nav.tabs,.cump,.seg,#avisos .banner:not(.bad){display:none!important}
  header.top,.hero,thead th,tr.res td,.seg button[aria-pressed=true]{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel,.kpi{box-shadow:none;break-inside:avoid}
  main{padding:8px 0}
}
</style>
</head>
<body>

<section id="login">
  <div class="tarjeta">
    <div class="cab"><h1>Grupo Premo</h1><p>Portal de accionistas · Informe financiero</p><div class="rayita"></div></div>
    <form id="f_login" autocomplete="on">
      <label for="u">Usuario</label><input id="u" type="text" autocomplete="username" required autofocus>
      <label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Ingresar</button>
      <div class="err" id="login_err" role="alert"></div>
    </form>
    <div class="pie">Información confidencial. Uso exclusivo de los accionistas.</div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="top"><div class="wrap">
    <div class="marca"><div class="cuadro">GP</div><div><div class="t" id="titulo">Grupo Premo</div><div class="s">Informe financiero · uso exclusivo de accionistas</div></div></div>
    <div class="estado"><div id="stamp"></div><span id="pill"></span></div>
    <button class="btn ghost" id="imprimir">Imprimir / PDF</button>
    <button class="btn ghost" id="tema" title="Cambiar claro/oscuro">Claro / oscuro</button>
    <button class="btn ghost" id="salir">Salir</button>
  </div></header>
  <nav class="tabs" role="tablist"><div class="wrap">
    <button role="tab" data-tab="resumen" aria-selected="true">Resumen ejecutivo</button>
    <button role="tab" data-tab="semanas" aria-selected="false">Próximas 4 semanas</button>
    <button role="tab" data-tab="flujo" aria-selected="false">Flujo de caja trimestral</button>
    <button role="tab" data-tab="cobranzas" aria-selected="false">Cobranzas</button>
    <button role="tab" data-tab="deuda" aria-selected="false">Deuda</button>
  </div></nav>
  <main><div class="wrap">
    <div id="avisos"></div>
    <div id="vista"></div>
    <footer id="pie"></footer>
  </div></main>
</div>

<script>
"use strict";
var API = "https://finetia.onrender.com";
var D = null, tab = "resumen", ent = "GRUPO", cumpl = 1;
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var NF1 = new Intl.NumberFormat("es-AR", {minimumFractionDigits:1, maximumFractionDigits:1});
var NF0 = new Intl.NumberFormat("es-AR", {maximumFractionDigits:0});
var r1 = function(v){ return Math.round((v || 0) / 1e5) / 10; };
var mm = function(v){ return NF1.format(r1(v)); };                                  // 1.234,5 (con signo −)
var par = function(v){ var x = r1(v); return x < 0 ? "(" + NF1.format(-x) + ")" : NF1.format(x); };   // (1.234,5) estilo contable
var MM = function(v){ var x = r1(v); return (x < 0 ? "−" : "") + "$ " + NF1.format(Math.abs(x)) + " M"; };
var dm = function(iso){ return iso ? iso.slice(8,10) + "/" + iso.slice(5,7) : ""; };
var dmy = function(iso){ return iso ? iso.slice(8,10) + "/" + iso.slice(5,7) + "/" + iso.slice(0,4) : ""; };
var pct = function(v){ return NF0.format(Math.round((v || 0) * 100)) + "%"; };
var SUMA = function(a){ return (a || []).reduce(function(x, y){ return x + (y || 0); }, 0); };
var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
  del: function(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
var NOMBRE = {GRUPO:"Grupo", HC:"Hormigones Cardales", PM:"Premoldeados"};

/* ---------- sesión ---------- */
function aplicarTema(t){ if (t) document.documentElement.setAttribute("data-theme", t); }
aplicarTema(store.get("gp_tema"));
$("tema").onclick = function(){
  var actual = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var nuevo = actual === "dark" ? "light" : "dark"; aplicarTema(nuevo); store.set("gp_tema", nuevo);
};
$("imprimir").onclick = function(){ window.print(); };
function mostrarLogin(msg){ $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("login_err").textContent = msg || ""; }
$("salir").onclick = function(){
  var t = store.get("gp_token"); store.del("gp_token");
  if (t) fetch(API + "/api/v1/auth/logout", {method:"POST", headers:{Authorization:"Bearer " + t}}).catch(function(){});
  D = null; mostrarLogin("");
};
$("f_login").onsubmit = function(ev){
  ev.preventDefault(); var err = $("login_err"); err.textContent = "Ingresando…";
  fetch(API + "/api/v1/auth/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username:$("u").value.trim(), password:$("p").value})})
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.detail || "No se pudo ingresar."); return j; }); })
    .then(function(j){ store.set("gp_token", j.token); $("p").value = ""; err.textContent = ""; cargar(); })
    .catch(function(e){ err.textContent = (e && e.message) || "No se pudo conectar con el servidor. Probá de nuevo en un minuto."; });
};
function cargar(){
  var t = store.get("gp_token"); if (!t) return mostrarLogin("");
  $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("vista").innerHTML = '<div class="panel">Cargando datos…</div>';
  fetch(API + "/api/v1/portal/resumen", {headers:{Authorization:"Bearer " + t}})
    .then(function(r){ return r.json().then(function(j){
      if (r.status === 401) { store.del("gp_token"); throw {login:true, message:"La sesión venció. Ingresá de nuevo."}; }
      if (!r.ok) throw new Error(j.detail || "Error del servidor."); return j; }); })
    .then(function(j){ D = j; cumpl = 1; pintar(); })
    .catch(function(e){
      if (e && e.login) return mostrarLogin(e.message);

    kpi("Pagos · 13 semanas", MM(F.pagos), "ARCA " + MM(F.totales.arca) + " · sueldos " + MM(F.totales.sueldos), "", spark(F.pagos_semanal.map(Math.abs), "var(--s2)")) +
    kpi("Deuda total", MM(deu.total), "descubierto, ARCA, cauciones, proveedores y otros", "warn") + '</div>';
  h += '<div class="panel"><h3>Alertas</h3>' + alertasDe(ent) + (ent === "GRUPO" ? '<div class="help">Para el grupo se suman los acuerdos de las dos empresas, lo que supone pasar fondos de PM a HC. Sin pasar fondos, el margen mínimo es ' + MM(Math.min.apply(null, F.margen_sin_intercompany || F.margen)) + '.</div>' : "") + '</div>';
  h += '<div class="panel"><h3>Posición bancaria acumulada · ' + NOMBRE[ent] + '</h3><div class="chart" id="ch_pos"></div><div class="help">En millones de pesos. Negativa = descubierto usado. Por debajo de la línea roja se superan los acuerdos con los bancos.</div></div>';
  h += '<div class="panel"><h3>Ingresos y egresos por semana</h3><div class="legend"><span><i style="background:var(--s1)"></i>Ingresos</span><span><i style="background:var(--s2)"></i>Egresos</span></div><div class="chart" id="ch_bar"></div></div>';
  h += (ent === "GRUPO" ? puntosAtencion() : "");
  $("vista").innerHTML = h;
  lineaPosicion($("ch_pos"), F.posicion, F.acuerdo, D.semanas);
  barrasSemanales($("ch_bar"), F.lineas.cobranza, F.pagos_semanal, D.semanas);
}
function alertasDe(e){
  var al = D.alertas.filter(function(a){ return a.emp === e; });
  return al.length ? al.map(function(a){ return '<div style="display:flex;gap:12px;justify-content:space-between;padding:7px 0 7px 12px;border-left:4px solid ' + (a.nivel === "rojo" ? "var(--bad)" : "var(--warn)") + ';margin:6px 0;font-size:13px"><span>' + esc(a.texto) + (a.peor !== undefined ? ' · punto más bajo ' + MM(a.peor) + ' en la semana ' + a.semanaPeor : "") + '</span>' + (a.nivel === "rojo" ? '<b class="num" style="color:var(--bad);white-space:nowrap">faltan ' + MM(-(a.peor + D.flujo[e].acuerdo)) + '</b>' : "") + '</div>'; }).join("") : '<div class="help">Sin alertas en las 13 semanas.</div>';
}
function vistaSemanas(){
  var F = D.flujo[ent]; if (!F.detalle) return sinDetalle();
  var n = 4, S = escenario(cumpl, ent), L = lineas(F.detalle, S, n), mn = Math.min.apply(null, L.posicion), pos0 = F.pos0;
  var h = '<div class="barra">' + selector() + '<span class="help" style="margin:0">Semanas del ' + dm(D.semanas[0].desde) + ' al ' + dm(D.semanas[n - 1].hasta) + '</span></div>' + panelCumplimiento();
  h += '<div class="kpis">' + kpi("Ingresos · 4 semanas", MM(SUMA(L.ingresos)), "cobranzas de clientes, echeqs y ventas nuevas", "") + kpi("Egresos · 4 semanas", MM(SUMA(L.egresos)), "proveedores, sueldos, impuestos, ARCA y financieros", "") +
    kpi("Resultado · 4 semanas", MM(SUMA(L.resultado)), "ingresos menos egresos", SUMA(L.resultado) < 0 ? "bad" : "ok") + kpi("Saldo al cierre de la semana 4", MM(L.posicion[n - 1]), "mínimo del período " + MM(mn), mn < -F.acuerdo ? "bad" : "warn") + '</div>';
  h += '<div class="grid2"><div class="panel"><h3>Posición bancaria al cierre de cada semana</h3><div class="chart" id="ch_pos"></div></div><div class="panel"><h3>Ingresos y egresos</h3><div class="legend"><span><i style="background:var(--s1)"></i>Ingresos</span><span><i style="background:var(--s2)"></i>Egresos</span></div><div class="chart" id="ch_bar"></div></div></div>';
  h += '<div class="panel" style="margin-top:16px"><h3>Cash flow de las próximas 4 semanas · ' + NOMBRE[ent] + (Math.abs(cumpl - 1) > 1e-9 ? " · cumplimiento " + pct(cumpl) : "") + '</h3>' + tablaFlujo(L, n, F, pos0) +
    '<div class="help">Los egresos no cambian con el cumplimiento de cobranza. Sueldos y NOF se estiman con el ritmo real de pagos de las últimas 13 semanas (' + (D.meta.ventana_ritmo ? dm(D.meta.ventana_ritmo[0]) + " al " + dm(D.meta.ventana_ritmo[1]) : "") + ') según los extractos bancarios.</div></div>';
  $("vista").innerHTML = h;
  lineaPosicion($("ch_pos"), L.posicion, F.acuerdo, D.semanas.slice(0, n));
  barrasSemanales($("ch_bar"), L.ingresos, L.egresos, D.semanas.slice(0, n));
}
function vistaFlujo(){
  var F = D.flujo[ent]; if (!F.detalle) return sinDetalle();
  var n = 13, S = escenario(cumpl, ent), L = lineas(F.detalle, S, n), mn = Math.min.apply(null, L.posicion), faltan = mn < -F.acuerdo ? -(mn + F.acuerdo) : 0;
  var h = '<div class="barra">' + selector() + '<span class="help" style="margin:0">Trimestre móvil: semanas del ' + dm(D.semanas[0].desde) + ' al ' + dm(D.semanas[n - 1].hasta) + '</span></div>' + panelCumplimiento();
  h += '<div class="kpis">' + kpi("Punto más bajo", MM(mn), "semana " + (L.posicion.indexOf(mn) + 1), faltan > 0 ? "bad" : "ok") + kpi("Faltan sobre acuerdos", faltan > 0 ? MM(faltan) : "—", F.acuerdo ? "acuerdos " + MM(F.acuerdo) : "sin acuerdo", faltan > 0 ? "bad" : "ok") +
    kpi("Ingresos · 13 semanas", MM(SUMA(L.ingresos)), pct(cumpl) + " de cumplimiento", "") + kpi("Egresos · 13 semanas", MM(SUMA(L.egresos)), "no cambian con el cumplimiento", "") + '</div>';
  h += '<div class="panel"><h3>Posición bancaria acumulada · ' + NOMBRE[ent] + (Math.abs(cumpl - 1) > 1e-9 ? " · cumplimiento " + pct(cumpl) : "") + '</h3><div class="chart" id="ch_pos"></div></div>';
  h += '<div class="panel"><h3>Flujo de caja trimestral · ' + NOMBRE[ent] + '</h3>' + tablaFlujo(L, n, F, F.pos0) + '</div>';
  h += '<div class="panel"><h3>¿Qué pasa si se cobra menos?</h3><div class="scrollx"><table><thead><tr><th>Cumplimiento</th><th>Punto más bajo</th><th>Semana</th><th>Faltan sobre acuerdos</th></tr></thead><tbody>' +
    D.escenarios.map(function(e){ var p = e.emp[ent].posicion, m = Math.min.apply(null, p), f = m < -F.acuerdo ? -(m + F.acuerdo) : 0;
      return '<tr' + (Math.abs(e.cumpl - cumpl) < 1e-9 ? ' class="sel"' : "") + '><td>' + pct(e.cumpl) + '</td><td class="num">' + par(m) + '</td><td class="num">' + (p.indexOf(m) + 1) + '</td><td class="num' + (f > 0 ? " neg" : "") + '">' + (f > 0 ? par(f) : "—") + '</td></tr>'; }).join("") + '</tbody></table></div></div>';
  h += '<details class="panel"><summary>Cómo se arma este flujo</summary><div class="help" style="font-size:13px;line-height:1.65;margin-top:10px">Saldos: Excel diario de Tesorería (cuentas corrientes y acuerdos de descubierto). Cobranzas: cuentas a cobrar por fecha de vencimiento; lo vencido se cobra la semana siguiente; AESA paga a 30 días desde la factura; las cobranzas confirmadas por el equipo toman la fecha real. Pagos: deuda a proveedores del sistema, cheques propios diferidos, planes de ARCA (pagados en el último día permitido), sueldos, impuestos y el ritmo de pagos reciente de los extractos bancarios. No incluye operaciones entre las empresas del grupo.</div></details>';
  $("vista").innerHTML = h;
  lineaPosicion($("ch_pos"), L.posicion, F.acuerdo, D.semanas);
}
function vistaCobranzas(){
  var C = D.cobranzas, t = C.total;
  var h = '<div class="kpis">' + kpi("Cartera a cobrar", MM(t.importe), t.facturas + " facturas abiertas (con IVA)", "") + kpi("Vencida", MM(t.vencido), pct(t.vencido / (t.importe || 1)) + " de la cartera", t.vencido > 0 ? "bad" : "ok") +
    kpi("A vencer en 30 días", MM(t.a_30), "", "") + kpi("A más de 30 días", MM(t.mas_30), "", "") + kpi("Con fecha real informada", t.con_fecha_real + " facturas", MM(t.importe_fecha_real), "warn") + '</div>';
  h += '<div class="grid2">' + ["HC","PM"].map(function(e){ var x = C.por_empresa[e];
    return '<div class="panel"><h3>' + NOMBRE[e] + '</h3><table><tbody><tr><td>Cartera</td><td class="num"><b>' + mm(x.importe) + '</b></td></tr><tr><td>Vencida</td><td class="num neg">' + mm(x.vencido) + '</td></tr><tr><td>A 30 días</td><td class="num">' + mm(x.a_30) + '</td></tr><tr><td>A más de 30 días</td><td class="num">' + mm(x.mas_30) + '</td></tr></tbody></table></div>'; }).join("") + '</div>';
  h += '<div class="panel" style="margin-top:16px"><h3>Principales clientes · en millones de $</h3><div class="scrollx"><table class="tl"><thead><tr><th>Cliente</th><th>Empresa</th><th class="n">Facturas</th><th class="n">Total</th><th class="n">Vencido</th><th class="n">A 30 días</th><th class="n">Más de 30</th><th class="n">Con fecha real</th></tr></thead><tbody>' +
    C.clientes.map(function(c){ return '<tr><td>' + esc(c.cliente) + '</td><td>' + c.emp + '</td><td class="num">' + c.facturas + '</td><td class="num"><b>' + mm(c.importe) + '</b></td><td class="num' + (c.vencido > 0 ? " neg" : "") + '">' + mm(c.vencido) + '</td><td class="num">' + mm(c.a_30) + '</td><td class="num">' + mm(c.mas_30) + '</td><td class="num">' + (c.con_fecha_real || "—") + '</td></tr>'; }).join("") +
    (C.otros_clientes ? '<tr class="tot"><td>Otros ' + C.otros_clientes + ' clientes</td><td></td><td></td><td class="num">' + mm(C.importe_otros) + '</td><td></td><td></td><td></td><td></td></tr>' : "") + '</tbody></table></div>' +
    '<div class="help">Echeqs de clientes en cartera: ' + C.echeqs_en_cartera.cantidad + ' por ' + MM(C.echeqs_en_cartera.importe) + '. “Con fecha real” indica que el equipo informó cuándo se cobra esa factura.</div></div>';
  $("vista").innerHTML = h;
}
var COL = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)"], ETQ = ["Descubierto bancario","Planes de ARCA","Cauciones","Proveedores","Otros pasivos"], CLV = ["descubierto","arca","cauciones","proveedores","otros"];
function vistaDeuda(){
  var R = D.deuda.resumen, G = R.GRUPO, A = D.deuda.arca, P = D.deuda.proveedores, S = D.deuda.pasivos;
  var h = '<div class="kpis">' + kpi("Deuda total del grupo", MM(G.total), "sin operaciones entre empresas", "warn") + ETQ.map(function(l, i){ return kpi(l, MM(G[CLV[i]]), pct(G[CLV[i]] / (G.total || 1)) + " del total", ""); }).join("") + '</div>';
  h += '<div class="panel"><h3>Composición de la deuda · en millones de $</h3><div class="legend">' + ETQ.map(function(l, i){ return '<span><i style="background:' + COL[i] + '"></i>' + l + '</span>'; }).join("") + '</div><div id="ch_deu"></div>' +
    '<div class="scrollx"><table style="margin-top:10px"><thead><tr><th></th>' + ETQ.map(function(l){ return '<th>' + l + '</th>'; }).join("") + '<th>Total</th></tr></thead><tbody>' +
    ["GRUPO","HC","PM"].map(function(e){ var r = R[e]; return '<tr' + (e === "GRUPO" ? ' class="tot"' : "") + '><td>' + NOMBRE[e] + '</td>' + CLV.map(function(k){ return '<td class="num">' + mm(r[k]) + '</td>'; }).join("") + '<td class="num"><b>' + mm(r.total) + '</b></td></tr>'; }).join("") + '</tbody></table></div>' +
    '<div class="help">El descubierto es lo usado hoy de los acuerdos con los bancos. Las garantías (por ejemplo el T-Bill que respalda el descubierto de PM) se muestran aparte y no suman.</div></div>';
  h += '<div class="panel"><h3>Planes de ARCA</h3>' + (A.planes.length ? '<div class="scrollx"><table class="tl"><thead><tr><th>Plan</th><th>Empresa</th><th class="n">Cuotas pendientes</th><th class="n">Saldo</th><th class="n">Cuotas vencidas</th><th class="n">Importe vencido</th><th class="n">Próxima cuota</th><th class="n">Se paga hasta</th></tr></thead><tbody>' +
    A.planes.map(function(p){ return '<tr><td>' + esc(p.plan) + '</td><td>' + p.emp + '</td><td class="num">' + p.cuotas + '</td><td class="num"><b>' + mm(p.saldo) + '</b></td><td class="num' + (p.vencidas ? " neg" : "") + '">' + (p.vencidas || "—") + '</td><td class="num' + (p.vencidas ? " neg" : "") + '">' + (p.vencidas ? mm(p.importe_vencido) : "—") + '</td><td class="num">' + dmy(p.proximo_vto) + '</td><td class="num">' + (p.proximo_limite ? dmy(p.proximo_limite) : "—") + '</td></tr>'; }).join("") +
    '<tr class="tot"><td>Total</td><td></td><td></td><td class="num">' + mm(A.saldo.HC + A.saldo.PM) + '</td><td></td><td class="num neg">' + mm(A.vencido.HC + A.vencido.PM) + '</td><td></td><td></td></tr></tbody></table></div>' : '<div class="help">Sin planes de ARCA pendientes.</div>') + '</div>';
  h += '<div class="panel"><h3>Cauciones</h3>' + (S.cauciones.length ? '<div class="scrollx"><table class="tl"><thead><tr><th>Agente</th><th>Boleto</th><th>Empresa</th><th class="n">Vence</th><th class="n">TNA</th><th class="n">Capital</th><th class="n">A pagar al vencimiento</th></tr></thead><tbody>' +
    S.cauciones.map(function(c){ return '<tr><td>' + esc(c.agente) + '</td><td>' + esc(c.boleto) + '</td><td>' + c.emp + '</td><td class="num">' + dmy(c.vto) + '</td><td class="num">' + (c.tna ? NF1.format(c.tna * 100) + "%" : "—") + '</td><td class="num">' + mm(c.capital) + '</td><td class="num"><b>' + mm(c.monto) + '</b></td></tr>'; }).join("") + '</tbody></table></div>' : '<div class="help">Sin cauciones vigentes.</div>') + '</div>';
  h += '<div class="panel"><h3>Proveedores · financiamiento con proveedores</h3><div class="grid2">' + ["HC","PM"].map(function(e){ var x = P.por_empresa[e]; return '<table><thead><tr><th>' + NOMBRE[e] + '</th><th>Monto</th></tr></thead><tbody><tr><td>Total a pagar</td><td class="num"><b>' + mm(x.importe) + '</b></td></tr><tr><td>Ya vencido</td><td class="num neg">' + mm(x.vencido) + '</td></tr><tr><td>Vence en 30 días</td><td class="num">' + mm(x.a_30) + '</td></tr><tr><td>Vence a más de 30 días</td><td class="num">' + mm(x.mas_30) + '</td></tr></tbody></table>'; }).join("") + '</div>' +
    '<div class="scrollx" style="margin-top:14px"><table class="tl"><thead><tr><th>Principales proveedores</th><th>Empresa</th><th class="n">Total</th><th class="n">Vencido</th></tr></thead><tbody>' + P.principales.map(function(p){ return '<tr><td>' + esc(p.proveedor) + '</td><td>' + p.emp + '</td><td class="num"><b>' + mm(p.importe) + '</b></td><td class="num' + (p.vencido > 0 ? " neg" : "") + '">' + (p.vencido > 0 ? mm(p.vencido) : "—") + '</td></tr>'; }).join("") +
    (P.otros ? '<tr class="tot"><td>Otros ' + P.otros + ' proveedores</td><td></td><td class="num">' + mm(P.importe_otros) + '</td><td></td></tr>' : "") + '</tbody></table></div></div>';
  h += '<div class="panel"><h3>Otros pasivos</h3>' + (S.otros.length ? '<div class="scrollx"><table class="tl"><thead><tr><th>Categoría</th><th>Concepto</th><th>Empresa</th><th class="n">Saldo</th><th class="n">Vence</th><th class="n">Cuota estimada</th><th>Observación</th></tr></thead><tbody>' +
    S.otros.map(function(o){ return '<tr style="' + (o.suma ? "" : "color:var(--ink-3)") + '"><td>' + esc(o.categoria) + '</td><td>' + esc(o.concepto) + '</td><td>' + o.emp + '</td><td class="num"><b>' + mm(o.saldo) + '</b>' + (o.suma ? "" : " (no suma)") + '</td><td class="num">' + (o.vto ? dmy(o.vto) : "—") + '</td><td class="num">' + (o.cuota ? mm(o.cuota) + (o.frecuencia ? " " + esc(o.frecuencia) : "") : "—") + '</td><td class="wrapc">' + esc(o.obs) + '</td></tr>'; }).join("") + '</tbody></table></div>' +
    '<div class="help">Total que suma a la deuda: ' + MM(S.otros_total) + '. Se carga en la planilla de pasivos de Drive (UOCRA, fondo de cese laboral, préstamos y otros).</div>' : '<div class="help">Todavía no se cargó la planilla de pasivos (UOCRA, fondo de cese laboral, etc.).</div>') + '</div>';
  $("vista").innerHTML = h;
  barraApilada($("ch_deu"), ["GRUPO","HC","PM"].map(function(e){ var r = R[e]; return {nombre:NOMBRE[e], total:r.total, partes:CLV.map(function(k){ return r[k]; })}; }), COL, ETQ);
}
function pintar(){
  if (!D) return;
  encabezado();
  if (tab === "resumen") vistaResumen(); else if (tab === "semanas") vistaSemanas(); else if (tab === "flujo") vistaFlujo(); else if (tab === "cobranzas") vistaCobranzas(); else vistaDeuda();
  $("pie").textContent = "Informe generado automáticamente por FINETIA · Solo lectura · Cifras en pesos; “M” = millones · Entre paréntesis, egresos y saldos negativos.";
}
function marcarTab(){ document.querySelectorAll("nav.tabs button").forEach(function(x){ x.setAttribute("aria-selected", x.getAttribute("data-tab") === tab); }); }
document.querySelectorAll("nav.tabs button").forEach(function(b){
  b.onclick = function(){ tab = b.getAttribute("data-tab"); marcarTab(); store.set("gp_tab", tab); pintar(); window.scrollTo(0, 0); };
});
$("vista").addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-ent")) { ent = b.getAttribute("data-ent"); pintar(); }
  else if (b.hasAttribute("data-c")) { cumpl = +b.getAttribute("data-c") / 100; pintar(); }
});
$("vista").addEventListener("input", function(ev){ if (ev.target.id === "rng") { cumpl = +ev.target.value / 100; pintar(); var r = $("rng"); if (r) r.focus(); } });
(function(){ var t = store.get("gp_tab"); if (t && document.querySelector('nav.tabs button[data-tab="' + t + '"]')) { tab = t; marcarTab(); } })();
cargar();
</script>
</body>
</html>
